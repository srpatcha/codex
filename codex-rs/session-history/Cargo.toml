[package]
name = "codex-session-history"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Session history tracking, search, export, and rotation for Codex"

[lib]
name = "codex_session_history"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
